<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mengenal Hermes — Prahu Hub</title>
<style>
  :root{--green:#198F51;--green-dark:#0F6E3B;--orange:#FB8C00;--ink:#16281F;--muted:#5C7566;}
  body{font-family:-apple-system,'Segoe UI',Roboto,Arial,sans-serif;background:#08261A;color:#fff;margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;}
  .card{max-width:460px;width:100%;}
  .brand{display:flex;align-items:baseline;gap:16px;margin-bottom:28px;}
  .brand img{height:18px;width:auto;align-self:center;filter:brightness(0) invert(1);}
  .brand .x{color:rgba(255,255,255,.4);font-size:22px;align-self:center;}
  .brand b{font-size:28px;font-family:Georgia,'Times New Roman',serif;font-weight:700;}
  h1{font-size:34px;font-weight:800;margin-bottom:12px;}
  p{color:#BFE9CD;line-height:1.5;margin-bottom:32px;}
  .links{display:flex;flex-direction:column;gap:14px;}
  a.btn{
    display:block;background:#fff;color:var(--green-dark);text-decoration:none;
    padding:18px 24px;border-radius:14px;font-weight:800;font-size:17px;
    transition:transform .15s;
  }
  a.btn:hover{transform:translateY(-2px);}
  a.btn.secondary{background:transparent;color:#fff;border:1px solid rgba(255,255,255,.35);}
  a.btn small{display:block;font-weight:500;color:var(--muted);margin-top:4px;font-size:14px;}
  a.btn.secondary small{color:#BFE9CD;}
</style>
</head>
<body>
<div class="card">
  <div class="brand"><img src="assets/prahu-hub-logo.png"><span class="x">×</span><b>Hermes</b></div>
  <h1>Mengenal Hermes</h1>
  <p>Knowledge Sharing — Prahu Hub, 12 September 2026</p>
  <div class="links">
    <a class="btn" href="index.html">▶ Buka Slide Deck</a>
    <a class="btn secondary" href="usecase-form.html">📝 Isi Usecase Kerjaan Anda</a>
  </div>
</div>
</body>
</html>
