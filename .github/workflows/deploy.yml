name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Generate config.js at build time only — this injects the form
      # submit token into the built site artifact, NOT into git history.
      # The secret HERMES_FORM_TOKEN is a fine-grained PAT scoped only to
      # this repo, Contents: Read+Write. Set it in
      # Settings -> Secrets and variables -> Actions -> New repository secret.
      - name: Inject form token into config.js
        run: |
          echo "window.HERMES_FORM_TOKEN = \"${{ secrets.HERMES_FORM_TOKEN }}\";" > config.js

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
